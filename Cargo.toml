[package]
name = "leuwi-panjang"
version = "0.1.3"
edition = "2021"

# The app lives in the library so both the desktop binary (src/main.rs) and the
# Android build share it. cargo-makepad compiles this into the Android cdylib
# (`.so`); `rlib` lets the desktop `leuwi-panjang` binary link against it.
[lib]
name = "leuwi_panjang"
crate-type = ["rlib", "cdylib"]

[dependencies]
makepad-widgets = { git = "https://github.com/makepad/makepad", branch = "main" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
libc = "0.2"

# SSH backend (milestone B): pure-Rust SSH so the terminal can reach nvgpu.
# Shared by desktop and Android — on Android it replaces the local PTY (there is
# no local shell); on desktop it powers SSH tabs and the `ssh-smoke` self-test.
# russh's default crypto backend is aws-lc-rs (needs nasm/clang to build); we use
# `ring` instead (only needs cc + perl) so it cross-compiles cleanly to Android.
russh = { version = "0.62", default-features = false, features = ["ring", "rsa", "flate2"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "io-util", "net", "sync", "macros", "time"] }

# Desktop-only backends: local PTY shell + system clipboard.
# (portable-pty pulls in `termios`, which does not build for the android target;
#  arboard has no android backend.)
[target.'cfg(not(target_os = "android"))'.dependencies]
portable-pty = "0.8"
arboard = "3"

# Metadata read by cargo-makepad for the Android build.
[package.metadata.makepad.android]
version_code = 13
version_name = "0.1.3"
# 29 (Android 10): Makepad's platform links AMidi (libamidi), which only exists
# in the NDK sysroot from API 29 onward — API 26 fails with `unable to find -lamidi`.
min_sdk_version = 29

[package.metadata.packager]
product_name = "Leuwi Panjang"
identifier = "com.situkangsayur.leuwipanjang"

[profile.release]
opt-level = 3
# LTO disabled: Makepad links the Android app crate with prefer-dynamic, which
# is incompatible with LTO ("cannot prefer dynamic linking when performing LTO").
lto = false
strip = true
